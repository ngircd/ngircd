name: ngIRCd Container

on:
  push:
    tags:
      - 'rel-*'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. rel-29), empty for the newest release'
        required: false
      force:
        description: 'Rebuild even if no updates are available'
        type: boolean
        default: true

concurrency:
  group: container
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ngircd
  BASE: docker.io/library/debian:stable-slim

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      ref: ${{ steps.ref.outputs.ref }}
      tags: ${{ steps.ref.outputs.tags }}
      base: ${{ steps.check.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine release tag and image tags
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          newest=$(git tag -l 'rel-*' --sort=-v:refname | grep -v -- '-rc' | head -n1)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ref="$GITHUB_REF_NAME"
          else
            ref="${INPUT_TAG:-$newest}"
          fi
          git rev-parse -q --verify "refs/tags/$ref" >/dev/null \
            || { echo "::error::Tag \"$ref\" not found!"; exit 1; }
          version="${ref#rel-}"
          tags="$IMAGE:$version"
          [ "$ref" = "$newest" ] && tags="$tags,$IMAGE:latest"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
          echo "tags=$tags" >>"$GITHUB_OUTPUT"
          echo "Building $ref as: $tags"
      - name: Check for updates
        id: check
        env:
          FORCE: ${{ inputs.force }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          base=$(docker buildx imagetools inspect "$BASE" --format '{{.Manifest.Digest}}')
          echo "base=$base" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] && [ "$FORCE" != "false" ]; then
            echo "build=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          image="$IMAGE:${REF#rel-}"
          if ! docker pull -q "$image"; then
            echo "Image \"$image\" not found, building it."
            echo "build=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          old=$(docker inspect "$image" \
            --format '{{index .Config.Labels "org.opencontainers.image.base.digest"}}')
          if [ "$old" != "$base" ]; then
            echo "Base image changed (\"$old\" -> \"$base\")."
            echo "build=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          updates=$(docker run --rm --user root --entrypoint /bin/sh "$image" \
            -c 'apt-get -qq update && apt-get -s upgrade' | grep -c '^Inst ' || true)
          echo "Available package updates: $updates"
          [ "$updates" -gt 0 ] && build=true || build=false
          echo "build=$build" >>"$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contrib/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          labels: |
            org.opencontainers.image.base.digest=${{ needs.prepare.outputs.base }}
            org.opencontainers.image.base.name=${{ env.BASE }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.ref }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          args=""
          for t in $(echo "$TAGS" | tr ',' ' '); do args="$args -t $t"; done
          docker buildx imagetools create $args \
            $(printf "$IMAGE@sha256:%s " *)
          for t in $(echo "$TAGS" | tr ',' ' '); do
            docker buildx imagetools inspect "$t"
          done
