[Global]
	Name = irc.example.net
	Info = repro server
	Ports = 6667
	MotdPhrase = repro
	ServerUID = nobody
[Limits]
	MaxConnections = 0
	MaxConnectionsIP = 0
	PingTimeout = 120
	PongTimeout = 20
[Options]
	DNS = no
	Ident = no
	PAM = no
	OperCanUseMode = yes
[SSL]
	CertFile = /conf/cert.pem
	KeyFile = /conf/key.pem
	Ports = 6697
[Operator]
	Name = oper
	Password = operpass
